<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PIXEL FOREST: Leaf Fall</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
    height:100vh;
    width:100vw;
    touch-action:none; /* Отключаем скролл на мобильных */
}
canvas{display:block}

/* UI Overlay */
#ui-layer{
    position:absolute;
    top:0;left:0;width:100%;height:100%;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    padding:20px;
}
.top-stats{
    display:flex;
    justify-content:space-between;
    align-items:center;
    color:#fff;
    text-shadow:0 2px 4px rgba(0,0,0,.3);
    font-weight:bold;
    font-size:24px;
}
.stat-box{
    background:rgba(255,255,255,.2);
    backdrop-filter:blur(5px);
    padding:10px 20px;
    border-radius:15px;
    border:1px solid rgba(255,255,255,.3);
}
.hearts{font-size:30px;color:#ff4757;text-shadow:0 0 10px #ff4757}
.score-val{color:#ffd700;font-size:32px}

/* Menus */
.menu-overlay{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.6);
    backdrop-filter:blur(10px);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:100;
    transition:opacity .5s;
}
.hidden{opacity:0;pointer-events:none;}
h1{
    font-size:min(12vw,60px);
    color:#fff;
    margin-bottom:10px;
    text-transform:uppercase;
    letter-spacing:2px;
    text-shadow:0 0 20px rgba(255,200,100,.8);
}
.subtitle{color:#ddd;margin-bottom:30px;font-size:18px}
.btn-play{
    padding:15px 50px;
    font-size:24px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(45deg,#ff6b6b,#feca57);
    border:none;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 10px 20px rgba(255,107,107,.4);
    transition:transform .2s;
    pointer-events:auto;
}
.btn-play:hover{transform:scale(1.1)}
.final-score-display{
    font-size:40px;
    color:#feca57;
    margin:20px 0;
    text-shadow:0 0 10px #feca57;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="ui-layer">
    <div class="top-stats">
        <div class="stat-box">SCORE: <span class="score-val" id="scoreDisplay">0</span></div>
        <div class="hearts" id="livesDisplay">❤️❤️❤️</div>
    </div>
</div>

<!-- START MENU -->
<div id="startMenu" class="menu-overlay">
    <h1>LEAF FALL</h1>
    <p class="subtitle">Кликай по листьям. Избегай камней!</p>
    <button class="btn-play" onclick="startGame()">ИГРАТЬ ▶</button>
</div>

<!-- GAME OVER MENU -->
<div id="gameOverMenu" class="menu-overlay hidden">
    <h1 style="color:#ff6b6b">GAME OVER</h1>
    <div class="final-score-display" id="finalScore">0</div>
    <button class="btn-play" onclick="location.reload()">ЗАНОВО ↺</button>
</div>

<script>
// === AUDIO ENGINE (Nature Sounds) ===
let audioCtx = null;
function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

// Soft "Pop" sound for leaf click
function playPop(freq = 600) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(freq * 1.5, audioCtx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
}

// Error buzz for stone
function playError() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.3);
}

// Victory chime
function playWinChime() {
    [523, 659, 783].forEach((f, i) => setTimeout(() => playPop(f), i * 100));
}

// === GAME SETUP ===
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let width, height;

function resize() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
}
window.addEventListener('resize', resize);
resize();

// Game State
let gameActive = false;
let score = 0;
let lives = 3;
let items = []; // Leaves and Stones
let particles = []; // Effects
let spawnTimer = 0;
let difficulty = 1;
let lastTime = 0;

// Config
const COLORS = ['#FF4757', '#FFA502', '#FFDA79', '#2ED573']; // Red, Orange, Yellow, Green leaves
const STONE_COLOR = '#747d8c';
const GOLDEN_LEAF = '#FDFD96';

class Item {
    constructor() {
        this.x = Math.random() * (width - 60) + 30;
        this.y = -50;
        this.size = 30 + Math.random() * 20;
        this.speedY = 2 + Math.random() * 2 + (difficulty * 0.5);
        this.speedX = (Math.random() - 0.5) * 1; // Slight wind drift
        this.rotation = Math.random() * Math.PI * 2;
        this.rotSpeed = (Math.random() - 0.5) * 0.1;
        
        // Type logic
        const rand = Math.random();
        if (rand > 0.85) {
            this.type = 'stone';
            this.color = STONE_COLOR;
        } else if (rand > 0.95) {
            this.type = 'golden';
            this.color = GOLDEN_LEAF;
            this.points = 50;
        } else {
            this.type = 'leaf';
            this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
            this.points = 10;
        }
        
        this.markedForDeletion = false;
    }

    update(dt) {
        this.y += this.speedY * (dt / 16);
        this.x += this.speedX * (dt / 16);
        this.rotation += this.rotSpeed;

        // Remove if off screen
        if (this.y > height + 50) {
            this.markedForDeletion = true;
            // Penalty for missing a leaf? Let's say no penalty for miss to keep it chill, 
            // but maybe lose points? For now, just remove.
        }
    }

    draw(ctx) {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.rotation);

        if (this.type === 'stone') {
            // Draw rough circle/polygon for stone
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(0, 0, this.size/2, 0, Math.PI*2);
            ctx.fill();
            // Highlight
            ctx.fillStyle = 'rgba(255,255,255,0.2)';
            ctx.beginPath();
            ctx.arc(-5, -5, this.size/4, 0, Math.PI*2);
            ctx.fill();
        } else {
            // Draw Leaf Shape (simple ellipse with stem)
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.ellipse(0, 0, this.size/2, this.size/3, 0, 0, Math.PI*2);
            ctx.fill();
            
            // Stem
            ctx.strokeStyle = '#555';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, this.size/3);
            ctx.lineTo(0, this.size/2 + 5);
            ctx.stroke();

            // Golden sparkle
            if (this.type === 'golden') {
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 20px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('★', 0, 5);
                ctx.shadowBlur = 0;
            }
        }
        ctx.restore();
    }
}

class Particle {
    constructor(x, y, color) {
        this.x = x;
        this.y = y;
        this.vx = (Math.random() - 0.5) * 5;
        this.vy = (Math.random() - 0.5) * 5;
        this.life = 1.0;
        this.color = color;
        this.size = Math.random() * 5 + 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life -= 0.05;
    }
    draw(ctx) {
        ctx.globalAlpha = this.life;
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// Input Handling
function handleInput(e) {
    if (!gameActive) return;
    
    let clientX, clientY;
    if (e.touches) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
    } else {
        clientX = e.clientX;
        clientY = e.clientY;
    }

    // Check collision backwards (top items first)
    for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        const dx = clientX - item.x;
        const dy = clientY - item.y;
        const dist = Math.sqrt(dx*dx + dy*dy);

        if (dist < item.size) {
            // HIT!
            if (item.type === 'stone') {
                // Wrong click
                lives--;
                playError();
                createExplosion(item.x, item.y, '#555');
                shakeScreen();
            } else {
                // Correct click (Leaf or Golden)
                score += item.points;
                playPop(item.type === 'golden' ? 800 : 600);
                createExplosion(item.x, item.y, item.color);
                if (item.type === 'golden') {
                    showFloatingText("+50", item.x, item.y, GOLDEN_LEAF);
                } else {
                    showFloatingText("+"+item.points, item.x, item.y, '#fff');
                }
            }
            
            item.markedForDeletion = true;
            updateUI();
            checkGameOver();
            break; // Only hit one item per tap
        }
    }
}

canvas.addEventListener('mousedown', handleInput);
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault(); // Prevent scroll
    handleInput(e);
}, {passive:false});

// Visual Effects Helpers
function createExplosion(x, y, color) {
    for(let i=0; i<10; i++) {
        particles.push(new Particle(x, y, color));
    }
}

let floatingTexts = [];
function showFloatingText(text, x, y, color) {
    floatingTexts.push({text, x, y, color, life: 1.0, vy: -1});
}

let shakeIntensity = 0;
function shakeScreen() {
    shakeIntensity = 10;
}

// Main Loop
function loop(timestamp) {
    if (!gameActive) return;

    const dt = timestamp - lastTime;
    lastTime = timestamp;

    // Clear Canvas
    ctx.clearRect(0, 0, width, height);

    // Apply Shake
    ctx.save();
    if (shakeIntensity > 0) {
        const dx = (Math.random() - 0.5) * shakeIntensity;
        const dy = (Math.random() - 0.5) * shakeIntensity;
        ctx.translate(dx, dy);
        shakeIntensity *= 0.9; // Decay
        if(shakeIntensity < 0.5) shakeIntensity = 0;
    }

    // Spawn Items
    spawnTimer++;
    // Spawn rate increases with difficulty
    const spawnRate = Math.max(20, 60 - (difficulty * 5)); 
    if (spawnTimer > spawnRate) {
        items.push(new Item());
        spawnTimer = 0;
        // Increase difficulty slowly
        if (items.length % 10 === 0) difficulty += 0.2;
    }

    // Update & Draw Items
    items.forEach(item => {
        item.update(dt);
        item.draw(ctx);
    });
    items = items.filter(i => !i.markedForDeletion);

    // Update & Draw Particles
    particles.forEach(p => {
        p.update();
        p.draw(ctx);
    });
    particles = particles.filter(p => p.life > 0);

    // Floating Texts
    ctx.font = "bold 24px Arial";
    ctx.textAlign = "center";
    floatingTexts.forEach(ft => {
        ft.y += ft.vy;
        ft.life -= 0.02;
        ctx.globalAlpha = ft.life;
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.globalAlpha = 1;
    });
    floatingTexts = floatingTexts.filter(ft => ft.life > 0);

    ctx.restore(); // End Shake

    requestAnimationFrame(loop);
}

// UI Updates
function updateUI() {
    document.getElementById('scoreDisplay').innerText = score;
    let heartsStr = '';
    for(let i=0; i<lives; i++) heartsStr += '❤️';
    document.getElementById('livesDisplay').innerText = heartsStr || '💔';
}

function checkGameOver() {
    if (lives <= 0) {
        gameActive = false;
        document.getElementById('finalScore').innerText = "SCORE: " + score;
        document.getElementById('gameOverMenu').classList.remove('hidden');
        playError(); // Sad sound
    }
}

function startGame() {
    initAudio();
    document.getElementById('startMenu').classList.add('hidden');
    document.getElementById('gameOverMenu').classList.add('hidden');
    
    // Reset State
    score = 0;
    lives = 3;
    items = [];
    particles = [];
    floatingTexts = [];
    difficulty = 1;
    spawnTimer = 0;
    lastTime = performance.now();
    gameActive = true;
    
    updateUI();
    requestAnimationFrame(loop);
}

// Initial Render
ctx.fillStyle = "#fff";
ctx.font = "20px Arial";
ctx.textAlign = "center";
ctx.fillText("Loading...", width/2, height/2);

</script>
</body>
</html>
